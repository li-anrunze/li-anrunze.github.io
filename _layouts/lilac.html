<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
  <meta name="theme-color" content="#F6F3EE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/lilac.css' | relative_url }}?v=20261104d">
</head>
<body>

  <div class="progress" aria-hidden="true"><span></span></div>

  <header class="topbar" id="top">
    <a class="brand" href="#hero">
      <img class="brand__flower" src="{{ '/images/magnolia-mini.png' | relative_url }}" alt="" aria-hidden="true">
      <span>Anrunze Li</span>
    </a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav" aria-label="Sections">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | remove: '/' }}">{{ link.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <img class="footer__flower" src="{{ '/images/magnolia-mini.png' | relative_url }}" alt="" aria-hidden="true">
    <p>© {{ site.time | date: '%Y' }} Anrunze Li · 黎安润泽</p>
    <p class="footer__quote">读万卷书，行万里路</p>
  </footer>

  <button class="to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <dialog class="lightbox" aria-label="Image preview">
    <button class="lightbox__close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <img alt="">
    <p class="lightbox__cap"></p>
  </dialog>

  <script src="{{ '/assets/js/lilac.js' | relative_url }}?v=20261104d" defer></script>
  {% include analytics.html %}
</body>
</html>
